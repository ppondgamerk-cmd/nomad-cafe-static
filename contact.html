<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Nomad Café</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="header">
  <div class="container">
    <div class="navbar">
      <div class="brand"><span class="dot"></span><span>Nomad Café</span></div>
      <div class="navlinks">
        <a href="home.html">Home</a>
        <a href="about.html">About</a>
        <a href="menu.html">Menu</a>
        <a href="seasonal.html">Seasonal</a>
        <a href="events.html">Events</a>
        <a href="testimonials.html">Testimonials</a>
        <a href="contact.html" class="active">Contact</a>
      </div>
    </div>
  </div>
</div>

<section class="section " id="contact" style="">
  <div class="container">
    
        <h2 class="center mb4">Contact Us</h2>
        <p class="center mb2 lead">Preorder a pie, reserve a table, or inquire about hosting an event!</p>
        <div class="row">
          <div class="col">
            <form class="contact-form card">
              <div class="body">
                <label>Name *</label><input type="text" required placeholder="Your name">
                <label>Email *</label><input type="email" required placeholder="name@example.com">
                <label>How can we help?</label><textarea rows="4" placeholder="Type your message..."></textarea>
                <label>Services *</label>
                <select required>
                  <option>Pie Preorder</option>
                  <option>Table Reservation</option>
                  <option>Event Hosting</option>
                  <option>Drink Inquiry</option>
                </select>
                <button class="btn" type="submit">Send Message</button>
              </div>
            </form>
          </div>
        </div>
        
  </div>
</section>
<footer class="footer">
  <div class="container">
    <h4 class="mb2">Stay Updated</h4>
    <div class="newsletter mb2">
      <input type="email" placeholder="Enter your email" />
      <a class="btn" href="#">Subscribe</a>
    </div>
    <p class="m0">State of Rio de Janeiro, Brazil</p>
    <p class="m0"><a href="mailto:info@nomadcafe.com">info@nomadcafe.com</a></p>
    <p class="m0">Copyright © Nomad Café 2025</p>
  </div>
</footer>
</body>
</html>
